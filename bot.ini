[bot]
symbol = XAUUSD
timeframes = M5,M15,H1,H4
confidence = 0.50
max_hold_bars = 24
interval = 15
mode = dry_run

[risk]
risk_per_trade = 0.01
daily_drawdown = 0.03
max_spread_points = 40.0
magic_number = 777001
order_comment = Mamba_XAUUSD_Bot

[artifacts]
# Default for this repo: point at the repo's existing artifacts.
# When you copy the bot to another machine, copy those files into a "model/" folder
# next to run_bot.py and change these paths to "model/mamba_xauusd_best.pt" etc.
model = saved_models/mamba_xauusd_best.pt
scaler = saved_models/feature_scaler.joblib
pruner = data/processed/correlation_pruner.joblib
calendar = data/economic_calendar.csv

